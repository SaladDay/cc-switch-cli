[package]
name = "cc-switch"
version = "5.10.4"
description = "All-in-One Assistant for Claude Code, Codex, Gemini, OpenCode & OpenClaw"
authors = ["Jason Young", "saladday"]
license = "MIT"
repository = "https://github.com/saladday/cc-switch-cli"
edition = "2021"
rust-version = "1.91.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["rlib"]

[[bin]]
name = "cc-switch"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:colored",
    "dep:comfy-table",
    "dep:console",
    "dep:crossterm",
    "dep:env_logger",
    "dep:indicatif",
    "dep:inquire",
    "dep:minisign-verify",
    "dep:ratatui",
    "dep:self-replace",
    "dep:semver",
    "dep:shlex",
    "dep:tachyonfx",
    "dep:tar",
    "dep:unicode-width",
    "dep:which",
    "dep:windows-sys",
    "dep:winreg",
]
test-hooks = []

[dependencies]
# Core dependencies
cc-switch-core = { git = "https://github.com/SaladDay/cc-switch-core", rev = "aa6c805e907c6d7bfce2d095be1d6e57f9289287" }
cc-switch-store = { git = "https://github.com/SaladDay/cc-switch-core", rev = "aa6c805e907c6d7bfce2d095be1d6e57f9289287" }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.21.3"
libc = "0.2"

# CLI dependencies
clap = { version = "4.5", features = ["derive", "cargo", "env", "wrap_help"], optional = true }
clap_complete = { version = "4.5", optional = true }
inquire = { version = "0.9", features = ["fuzzy"], optional = true }
console = { version = "0.15", optional = true }
comfy-table = { version = "7.1", optional = true }
colored = { version = "2.1", optional = true }
indicatif = { version = "0.17", optional = true }
env_logger = { version = "0.11", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", features = ["osc52"], optional = true }

# File and path utilities
dirs = "5.0"
tempfile = "3"
which = { version = "6.0", optional = true }

# Serialization
toml = "0.8"
toml_edit = "0.22"
serde_yaml = "0.9"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
rust_decimal = "1.33"
json5 = "0.4"
json-five = "0.3.1"

# Network and async
# Keep bundled roots for portable builds and add OS roots for enterprise/private CAs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "json", "stream", "socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "process", "io-util"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }

# Utilities
regex = "1.10"
sha2 = "0.10"
hmac = "0.12"
shlex = { version = "1.3", optional = true }
minisign-verify = { version = "0.2.4", optional = true }
semver = { version = "1.0", optional = true }
flate2 = "1.0"
brotli = "7"
tar = { version = "0.4", optional = true }
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
zip = "2.2"
url = "2.5"
percent-encoding = "2.3"
unicode-width = { version = "0.1", optional = true }
tachyonfx = { version = "0.25", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = { version = "0.52", optional = true }
self-replace = { version = "1", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

[dev-dependencies]
minisign = "0.9.1"
serial_test = "3"
tempfile = "3"
